name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x LimeStudio/gradlew

      - name: Configure Keystore and Signing Credentials
        run: |
          cat << 'EOF' | base64 -d > LimeStudio/lime_github_release.jks
          
          EOF
          cat << 'EOF' > LimeStudio/keystore.properties
          storeFile=lime_github_release.jks
          storePassword=limeime2026
          keyAlias=limeime
          keyPassword=limeime2026
          EOF

      - name: Run Unit Tests
        run: |
          cd LimeStudio
          ./gradlew testDebugUnitTest

      - name: Build Signed Release APK
        run: |
          cd LimeStudio
          ./gradlew assembleRelease

      - name: Verify APK Signature
        run: |
          echo "Verifying Release APK signature..."
          APK_PATH=$(ls LimeStudio/app/build/outputs/apk/release/*.apk | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --print-certs "$APK_PATH"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LIMEHD-6.2.1-release-apk
          path: LimeStudio/app/build/outputs/apk/release/*.apk
          retention-days: 14
