name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x LimeStudio/gradlew

      - name: Run Unit Tests
        run: |
          cd LimeStudio
          ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: |
          cd LimeStudio
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LIMEHD-v6.2.0-DarkAccent-debug-apk
          path: LimeStudio/app/build/outputs/apk/debug/*.apk
          retention-days: 14
